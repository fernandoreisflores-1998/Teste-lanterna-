<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Autonomia Pro</title>
    <link rel="manifest" href='data:application/json,{"name":"Monitor de Autonomia","short_name":"AutonomiaPro","start_url":"./","display":"standalone","background_color":"#ffffff","theme_color":"#28a745","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2906/2906274.png","sizes":"192x192","type":"image/png"}]}'>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f4f4f4; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; margin: 10px; font-weight: bold; transition: background 0.3s; }
        #btnIniciar { background: #28a745; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #btnIniciar:hover { background: #218838; }
        #btnReiniciar { background: #ffc107; color: #333; display: none; }
        #video { border: 4px solid #ccc; border-radius: 8px; width: 100%; max-width: 320px; background-color: black; }
        #status { font-size: 18px; color: #333; margin-top: 20px; font-weight: bold; min-height: 50px; padding: 10px; background: white; border-radius: 8px; display: inline-block; }
        .borda-alerta { border: 2px solid red; background-color: #f8d7da; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h3>Monitor de Autonomia Pro</h3>
    <video id="video" autoplay playsinline muted></video>
    <br>
    <button id="btnIniciar">INICIAR MONITORAMENTO</button>
    <button id="btnReiniciar">REINICIAR TESTE</button>
    <br>
    <div id="status">Aguardando câmera...</div>

    <script>
        // --- Configurações Offline ---
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); });`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }

        // --- Configurações de Áudio (Bip) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarBip() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tom agudo
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); // Volume
            osc.start(); osc.stop(audioCtx.currentTime + 1.5); // Duração
        }

        // --- Variáveis Globais ---
        const video = document.getElementById('video'), status = document.getElementById('status'),
              btnIniciar = document.getElementById('btnIniciar'), btnReiniciar = document.getElementById('btnReiniciar');
        
        const canvas = document.createElement('canvas'); // Canvas oculto para análise
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = 160; canvas.height = 120; // Resolução menor = mais rápido

        let wakeLock = null, horaInicio = null, rodando = false, esperandoLanterna = false;
        let brilhoBase = 0, contadorFalhas = 0;

        // --- Iniciar Câmera ---
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 320, height: 240 } })
        .then(stream => { 
            video.srcObject = stream; 
            status.innerText = "Câmera pronta! Aponte para a lanterna DESLIGADA e pressione INICIAR."; 
        })
        .catch(err => {
            status.innerText = "ERRO: Sem acesso à câmera. Verifique as permissões.";
            console.error(err);
        });

        // --- Função para Calcular Brilho Médio ---
        function calcularBrilhoMedio() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return 0;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            let somaBrilho = 0;

            // Percorre os pixels (R, G, B, A)
            for (let i = 0; i < data.length; i += 4) {
                // Fórmula padrão de luminosidade: 0.2126*R + 0.7152*G + 0.0722*B
                const luminosidade = (0.2126 * data[i]) + (0.7152 * data[i + 1]) + (0.0722 * data[i + 2]);
                somaBrilho += luminosidade;
            }
            return somaBrilho / (canvas.width * canvas.height); // Média de 0 a 255
        }

        // --- Lógica do Botão Iniciar ---
        function iniciarTeste() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // 1. Mede o brilho do ambiente COM A LANTERNA DESLIGADA
            brilhoBase = calcularBrilhoMedio();
            console.log("Brilho Base Ambiente:", brilhoBase);

            status.innerHTML = "<strong>Ambiente analisado.</strong><br>Ligue a lanterna agora para começar.";
            esperandoLanterna = true;
            btnIniciar.style.display = 'none';
        }

        btnIniciar.addEventListener('click', iniciarTeste);
        btnReiniciar.addEventListener('click', () => { location.reload(); });

        // --- LOOP PRINCIPAL DE ANÁLISE (Rápido: 250ms) ---
        // Usamos 250ms para garantir resposta rápida à sombras
        setInterval(() => {
            if (!esperandoLanterna && !rodando) return;
            
            const brilhoAtual = calcularBrilhoMedio();

            if (esperandoLanterna) {
                // GATILHO DE INÍCIO: Brilho subiu significativamente (pelo menos +40 pontos)
                if (brilhoAtual > (brilhoBase + 40)) { 
                    rodarMonitoramento();
                }
            } else if (rodando) {
                // GATILHO DE FIM: Brilho caiu perto do nível base (ambiente)
                // Usamos uma margem de segurança de +15 sobre o ambiente
                if (brilhoAtual < (brilhoBase + 15)) { 
                    contadorFalhas++;
                    // Tolerância de 3 segundos contra sombras (3s / 0.25s = 12 ciclos)
                    if (contadorFalhas >= 12) {
                        finalizarTeste();
                    } else {
                        status.innerText = "Interferência? Verificando... (" + Math.ceil((12 - contadorFalhas)*0.25) + "s)";
                        status.className = "borda-alerta";
                    }
                } else {
                    // Luz está boa
                    contadorFalhas = 0; // Reseta o tempo de espera
                    status.innerText = "Monitorando autonomia... (Lanterna OK)";
                    status.className = "";
                }
            }
        }, 250); 

        // --- Funções de Estado do Teste ---
        async function rodarMonitoramento() {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
            horaInicio = new Date();
            rodando = true;
            esperandoLanterna = false;
            status.className = "";
            console.log("Teste Iniciado às:", horaInicio.toLocaleTimeString());
        }

        function finalizarTeste() {
            const horaFim = new Date();
            const duracaoSegundos = Math.round((horaFim - horaInicio) / 1000);
            const minutos = Math.floor(duracaoSegundos / 60);
            const segundos = duracaoSegundos % 60;

            status.innerHTML = `<div>TESTE FINALIZADO!</div><br>Duração Total: <strong>${minutos}m ${segundos}s</strong>`;
            status.className = "borda-alerta";
            
            tocarBip();
            
            rodando = false;
            btnReiniciar.style.display = 'inline-block';
            if (wakeLock) wakeLock.release();
            console.log("Teste Finalizado às:", horaFim.toLocaleTimeString(), "Duração:", duracaoSegundos, "s");
        }
    </script>
</body>
</html>
