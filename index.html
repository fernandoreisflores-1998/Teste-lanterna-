<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Autonomia Pro</title>
    <link rel="manifest" href='data:application/json,{"name":"Monitor de Autonomia","short_name":"AutonomiaPro","start_url":"./","display":"standalone","background_color":"#ffffff","theme_color":"#28a745","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2906/2906274.png","sizes":"192x192","type":"image/png"}]}'>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        #btnIniciar { background: #28a745; color: white; }
        #btnReiniciar { background: #ffc107; display: none; }
        #video { border: 2px solid #ccc; width: 100%; max-width: 320px; }
        #status { font-size: 16px; color: #333; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h3>Monitor de Autonomia Pro</h3>
    <video id="video" autoplay playsinline></video>
    <br><br>
    <button id="btnIniciar">INICIAR MONITORAMENTO</button>
    <button id="btnReiniciar">REINICIAR TESTE</button>
    <div id="status">Aguardando permissão da câmera...</div>

    <script>
        // Registrar Offline
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); });`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarBip() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        const video = document.getElementById('video'), status = document.getElementById('status'),
              btnIniciar = document.getElementById('btnIniciar'), btnReiniciar = document.getElementById('btnReiniciar');
        
        let wakeLock = null, horaInicio, rodando = false, esperandoLanterna = false, pixelsBase = 0, contadorFalhas = 0;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; status.innerText = "Câmera pronta! Pressione INICIAR."; })
        .catch(() => status.innerText = "ERRO: Permissão negada.");

        function iniciarTeste() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240;
            const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, 320, 240);
            const frameBase = ctx.getImageData(0, 0, 320, 240).data;
            pixelsBase = 0;
            for (let i = 0; i < frameBase.length; i += 4) {
                if (frameBase[i] > 250 && frameBase[i+1] > 250 && frameBase[i+2] > 250) pixelsBase++;
            }
            
            status.innerHTML = "<strong>Aguardando ativação:</strong><br>Ligue a lanterna para começar.";
            esperandoLanterna = true;
            btnIniciar.style.display = 'none';
        }

        btnIniciar.addEventListener('click', iniciarTeste);
        btnReiniciar.addEventListener('click', () => { location.reload(); });

        // Loop mais rápido (500ms) para detectar variações instantâneas
        setInterval(() => {
            if (!esperandoLanterna && !rodando) return;
            
            const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240;
            const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, 320, 240);
            const frame = ctx.getImageData(0, 0, 320, 240).data;
            let pixelsAtuais = 0;
            for (let i = 0; i < frame.length; i += 4) {
                if (frame[i] > 250 && frame[i+1] > 250 && frame[i+2] > 250) pixelsAtuais++;
            }

            if (esperandoLanterna) {
                if (pixelsAtuais > (pixelsBase + 50)) rodarMonitoramento();
            } else if (rodando) {
                // Se a lanterna apagar (brilho cai abaixo da base)
                if (pixelsAtuais < (pixelsBase + 20)) { 
                    contadorFalhas++;
                    // 3 segundos = 6 ciclos de 500ms
                    if (contadorFalhas >= 6) finalizarTeste(); 
                    else status.innerText = "Interferência detectada! Aguardando...";
                } else {
                    contadorFalhas = 0; // Se a luz volta, reseta o tempo de espera
                    status.innerText = "Monitorando... (Lanterna OK)";
                }
            }
        }, 500); 

        async function rodarMonitoramento() {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
            horaInicio = new Date();
            rodando = true;
            esperandoLanterna = false;
        }

        function finalizarTeste() {
            const duracao = Math.round((new Date() - horaInicio) / 1000);
            status.innerHTML = `<div style="padding:15px; background:#f8d7da; border:2px solid red;">TESTE FINALIZADO!<br>Duração: ${Math.floor(duracao/60)}m ${duracao%60}s</div>`;
            tocarBip();
            rodando = false;
            btnReiniciar.style.display = 'inline-block';
            if (wakeLock) wakeLock.release();
        }
    </script>
</body>
</html>
