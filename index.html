<script>
    // Registro Offline
    if ('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); });`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarBip() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 1.5);
    }

    const video = document.getElementById('video'), status = document.getElementById('status'),
          btnIniciar = document.getElementById('btnIniciar'), btnReiniciar = document.getElementById('btnReiniciar'),
          divHistorico = document.getElementById('historico');
    
    const canvas = document.createElement('canvas'); 
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const foco = { x: 100, y: 75, w: 100, h: 75 };

    let rodando = false, esperandoLanterna = false, base = 0, falhas = 0, horaInicio;

    // Função de inicialização da câmera com tratamento de erro robusto
    function iniciarCamera() {
        status.innerText = "Solicitando acesso à câmera...";
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: { ideal: "environment" }, 
                width: { ideal: 320 }, 
                height: { ideal: 240 } 
            } 
        })
        .then(stream => { 
            video.srcObject = stream; 
            status.innerText = "Câmera pronta! Aponte a lanterna DESLIGADA para o quadrado verde.";
            console.log("Câmera conectada com sucesso.");
        })
        .catch(err => { 
            status.innerHTML = "<strong>ERRO:</strong> Câmera negada ou indisponível. Recarregue a página.";
            console.error("Erro na câmera:", err);
        });
    }

    // Tenta iniciar a câmera assim que a página carregar
    window.addEventListener('load', iniciarCamera);

    function carregarHistorico() {
        const logs = JSON.parse(localStorage.getItem('testes') || '[]');
        divHistorico.innerHTML = logs.map(t => `<div class="teste-item"><b>${t.nome}:</b> ${t.duracao} (Início: ${t.inicio})</div>`).join('');
    }

    function getBrilhoCentro() {
        if (video.readyState !== video.HAVE_ENOUGH_DATA) return 0;
        ctx.drawImage(video, 0, 0, 320, 240);
        const data = ctx.getImageData(foco.x, foco.y, foco.w, foco.h).data;
        let soma = 0;
        for (let i = 0; i < data.length; i += 4) soma += (data[i] + data[i+1] + data[i+2]) / 3;
        return soma / (foco.w * foco.h);
    }

    btnIniciar.onclick = () => {
        base = getBrilhoCentro();
        status.innerText = "Ligue a lanterna e aponte para o quadrado verde.";
        esperandoLanterna = true;
        btnIniciar.style.display = 'none';
    };

    btnReiniciar.onclick = () => location.reload();
    document.getElementById('btnLimpar').onclick = () => { localStorage.removeItem('testes'); carregarHistorico(); };

    setInterval(() => {
        if (!esperandoLanterna && !rodando) return;
        let brilho = getBrilhoCentro();

        if (esperandoLanterna && brilho > base + 40) {
            horaInicio = new Date();
            rodando = true; esperandoLanterna = false;
            status.innerText = "Monitorando... (Lanterna OK)";
        } else if (rodando) {
            if (brilho < base + 20) {
                falhas++;
                status.innerText = "Verificando sombra: " + falhas + "/6";
                if (falhas >= 6) finalizarTeste();
            } else { falhas = 0; status.innerText = "Monitorando... (Lanterna OK)"; }
        }
    }, 500);

    function finalizarTeste() {
        tocarBip();
        const duracaoSegs = Math.round((new Date() - horaInicio) / 1000);
        const duracaoStr = `${Math.floor(duracaoSegs/60)}m ${duracaoSegs%60}s`;
        status.innerHTML = `<div style="color:red">TESTE FINALIZADO!<br>Duração: ${duracaoStr}</div>`;
        
        let logs = JSON.parse(localStorage.getItem('testes') || '[]');
        logs.unshift({ nome: "Teste " + (logs.length + 1), inicio: horaInicio.toLocaleTimeString(), duracao: duracaoStr });
        localStorage.setItem('testes', JSON.stringify(logs.slice(0, 3)));
        
        rodando = false;
        btnReiniciar.style.display = 'inline-block';
        carregarHistorico();
    }

    carregarHistorico();
</script>
