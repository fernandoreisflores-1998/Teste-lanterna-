<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Autonomia</title>
    <style>
        body { font-family: sans-serif; padding: 10px; text-align: center; background: #f4f4f4; }
        #video-container { position: relative; display: inline-block; }
        #video { width: 300px; height: 225px; background: black; border: 3px solid #555; }
        #foco { position: absolute; top: 75px; left: 100px; width: 100px; height: 75px; border: 2px dashed #0f0; pointer-events: none; }
        button { padding: 15px 25px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; margin: 10px; font-weight: bold; }
        #btnIniciar { background: #28a745; color: white; }
        #btnReiniciar { background: #ffc107; display: none; }
        #status { font-size: 16px; margin: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h3>Monitor de Autonomia</h3>
    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="foco"></div>
    </div>
    <br>
    <button id="btnIniciar">INICIAR MONITORAMENTO</button>
    <button id="btnReiniciar">REINICIAR TESTE</button>
    <div id="status">Carregando...</div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const foco = { x: 100, y: 75, w: 100, h: 75 };
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        let rodando = false, esperandoLanterna = false, base = 0, falhas = 0, horaInicio;

        // Inicia a câmera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
            video.srcObject = stream;
            status.innerText = "Câmera pronta! Aponte a lanterna DESLIGADA para o quadrado verde.";
        })
        .catch(err => {
            status.innerText = "Erro na câmera: " + err.message;
        });

        document.getElementById('btnIniciar').onclick = () => {
            ctx.drawImage(video, 0, 0, 320, 240);
            const data = ctx.getImageData(foco.x, foco.y, foco.w, foco.h).data;
            let soma = 0;
            for (let i = 0; i < data.length; i += 4) soma += (data[i] + data[i+1] + data[i+2]) / 3;
            base = soma / (foco.w * foco.h);
            
            status.innerText = "Base capturada. Ligue a lanterna no quadrado verde!";
            esperandoLanterna = true;
            document.getElementById('btnIniciar').style.display = 'none';
        };

        setInterval(() => {
            if (!esperandoLanterna && !rodando) return;
            
            ctx.drawImage(video, 0, 0, 320, 240);
            const data = ctx.getImageData(foco.x, foco.y, foco.w, foco.h).data;
            let soma = 0;
            for (let i = 0; i < data.length; i += 4) soma += (data[i] + data[i+1] + data[i+2]) / 3;
            let brilho = soma / (foco.w * foco.h);

            if (esperandoLanterna && brilho > base + 40) {
                horaInicio = new Date();
                rodando = true; esperandoLanterna = false;
                status.innerText = "Monitorando... (Lanterna OK)";
            } else if (rodando) {
                if (brilho < base + 20) {
                    falhas++;
                    if (falhas >= 6) {
                        rodando = false;
                        status.innerText = "TESTE FINALIZADO!";
                        document.getElementById('btnReiniciar').style.display = 'inline-block';
                        new AudioContext().beep ? new AudioContext().beep() : null; // Simples
                    }
                } else { falhas = 0; }
            }
        }, 500);
    </script>
</body>
</html>
