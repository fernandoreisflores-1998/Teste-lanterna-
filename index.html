<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Autonomia Pro</title>
    <link rel="manifest" href='data:application/json,{"name":"Monitor de Autonomia","short_name":"AutonomiaPro","start_url":"./","display":"standalone","background_color":"#ffffff","theme_color":"#28a745","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2906/2906274.png","sizes":"192x192","type":"image/png"}]}'>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        #btnIniciar { background: #28a745; color: white; }
        #btnReiniciar { background: #ffc107; display: none; }
        #btnLimpar { background: #dc3545; color: white; font-size: 12px; padding: 5px 10px; margin-top: 10px; }
        .teste-item { border-bottom: 1px solid #ccc; padding: 8px; background: #f9f9f9; }
        #video { border: 2px solid #ccc; width: 100%; max-width: 320px; }
        #status { font-size: 18px; color: #333; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h3>Monitor de Autonomia Pro</h3>
    <video id="video" autoplay playsinline></video>
    <br><br>
    <button id="btnIniciar">INICIAR MONITORAMENTO</button>
    <button id="btnReiniciar">REINICIAR TESTE</button>
    <div id="status">Aguardando permissão da câmera...</div>
    <br>
    <h4>Histórico:</h4>
    <button id="btnLimpar">LIMPAR HISTÓRICO</button>
    <div id="historico" style="text-align: left; font-size: 14px; margin-top: 10px;"></div>

    <script>
        // Registro Offline
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); });`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarBip() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        const video = document.getElementById('video'), status = document.getElementById('status'),
              btnIniciar = document.getElementById('btnIniciar'), btnReiniciar = document.getElementById('btnReiniciar');
        
        let wakeLock = null, horaInicio, rodando = false, esperandoLanterna = false, pixelsBase = 0, contagemEscuridao = 0;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { 
            video.srcObject = stream; 
            status.innerText = "Câmera pronta! Pressione INICIAR.";
        }).catch(() => status.innerText = "ERRO: Permissão de câmera negada.");

        function iniciarTeste() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Mede o ambiente
            const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240;
            const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, 320, 240);
            const frameBase = ctx.getImageData(0, 0, 320, 240).data;
            pixelsBase = 0;
            for (let i = 0; i < frameBase.length; i += 4) {
                if (frameBase[i] > 250 && frameBase[i+1] > 250 && frameBase[i+2] > 250) pixelsBase++;
            }
            
            status.innerHTML = "<strong>Instrução:</strong><br>Ligue a lanterna e aponte para a câmera.";
            esperandoLanterna = true;
            btnIniciar.style.display = 'none';
        }

        btnIniciar.addEventListener('click', iniciarTeste);
        btnReiniciar.addEventListener('click', () => { location.reload(); });

        setInterval(() => {
            if (!esperandoLanterna && !rodando) return;
            
            const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240;
            const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, 320, 240);
            const frame = ctx.getImageData(0, 0, 320, 240).data;
            let pixelsAtuais = 0;
            for (let i = 0; i < frame.length; i += 4) {
                if (frame[i] > 250 && frame[i+1] > 250 && frame[i+2] > 250) pixelsAtuais++;
            }

            if (esperandoLanterna) {
                if (pixelsAtuais > (pixelsBase + 50)) rodarMonitoramento();
            } else if (rodando) {
                // Filtro anti-falso: só encerra se o brilho cair abaixo do limite por 3 segundos seguidos
                if (pixelsAtuais < (pixelsBase + 20)) { 
                    contagemEscuridao++;
                    status.innerText = "Sombra detectada... Verificando: " + contagemEscuridao + "/3";
                    if (contagemEscuridao >= 3) finalizarTeste();
                } else {
                    contagemEscuridao = 0; // Reseta se a luz voltar
                    status.innerText = "Monitorando... (Lanterna ligada)";
                }
            }
        }, 1000);

        async function rodarMonitoramento() {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
            horaInicio = new Date();
            rodando = true;
            esperandoLanterna = false;
        }

        function finalizarTeste() {
            const horaFim = new Date();
            const duracao = Math.round((horaFim - horaInicio) / 1000);
            const duracaoStr = `${Math.floor(duracao/60)}m ${duracao%60}s`;
            status.innerHTML = `<div style="padding:15px; background:#f8d7da; border:2px solid red;">TESTE FINALIZADO!<br>Duração: ${duracaoStr}</div>`;
            tocarBip();
            let logs = JSON.parse(localStorage.getItem('testes') || '[]');
            logs.unshift({ nome: "Teste " + (logs.length + 1), inicio: horaInicio.toLocaleTimeString(), duracao: duracaoStr });
            localStorage.setItem('testes', JSON.stringify(logs.slice(0, 3)));
            rodando = false;
            btnReiniciar.style.display = 'inline-block';
            if (wakeLock) wakeLock.release();
        }
    </script>
</body>
</html>
