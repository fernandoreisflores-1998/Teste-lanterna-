<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Autonomia Pro</title>
    <style>
        body { font-family: sans-serif; padding: 10px; text-align: center; background: #222; color: white; }
        #video-container { position: relative; display: inline-block; }
        #video { width: 300px; height: 225px; background: black; border: 3px solid #555; }
        /* Desenha o quadrado de foco na tela */
        #foco { position: absolute; top: 75px; left: 100px; width: 100px; height: 75px; border: 2px dashed #0f0; pointer-events: none; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; margin: 10px; font-weight: bold; }
        #btnIniciar { background: #28a745; color: white; }
        #status { font-size: 16px; margin: 15px; color: #0f0; }
    </style>
</head>
<body>

    <h3>Monitor de Autonomia</h3>
    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="foco"></div>
    </div>
    <br>
    <button id="btnIniciar">INICIAR MONITORAMENTO</button>
    <div id="status">Aponte a lanterna para o quadrado verde.</div>

    <script>
        const video = document.getElementById('video'), status = document.getElementById('status');
        const canvas = document.createElement('canvas'); 
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        // Foco apenas no centro: x=100, y=75, w=100, h=75
        const foco = { x: 100, y: 75, w: 100, h: 75 };

        let rodando = false, esperandoLanterna = false, base = 0, falhas = 0;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => video.srcObject = stream);

        function getBrilhoCentro() {
            ctx.drawImage(video, 0, 0, 320, 240);
            const data = ctx.getImageData(foco.x, foco.y, foco.w, foco.h).data;
            let soma = 0;
            for (let i = 0; i < data.length; i += 4) soma += (data[i] + data[i+1] + data[i+2]) / 3;
            return soma / (foco.w * foco.h);
        }

        document.getElementById('btnIniciar').onclick = () => {
            base = getBrilhoCentro();
            status.innerText = "Base capturada. Ligue a lanterna no quadrado!";
            esperandoLanterna = true;
            document.getElementById('btnIniciar').style.display = 'none';
        };

        setInterval(() => {
            if (!esperandoLanterna && !rodando) return;
            let brilho = getBrilhoCentro();

            if (esperandoLanterna && brilho > base + 50) {
                rodando = true; esperandoLanterna = false;
                status.innerText = "Monitorando... (Não obstrua o foco)";
            } else if (rodando) {
                if (brilho < base + 30) {
                    falhas++;
                    if (falhas >= 6) { // 3 segundos (6 * 0.5s)
                        status.innerText = "TESTE FINALIZADO!";
                        rodando = false;
                        new AudioContext().createOscillator().start(); // Simples beep
                        alert("Teste concluído!");
                    }
                } else { falhas = 0; }
            }
        }, 500);
    </script>
</body>
</html>
